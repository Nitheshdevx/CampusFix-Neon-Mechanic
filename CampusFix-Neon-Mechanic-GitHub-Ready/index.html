<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusFix – College Maintenance Portal</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--acc:#f59e0b;--pri:#1e3a8a;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px;margin:4px 0 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
button.alt{background:#e2e8f0;color:var(--ink)}button.ok{background:#16a34a}button.danger{background:#dc2626;color:#fff}button:hover{opacity:.9}
label{font-size:13px;color:var(--mut);font-weight:600}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center}
.hero svg{width:min(320px,80%)}#say{margin-top:8px;background:#ffffff22;padding:8px 14px;border-radius:20px;min-height:36px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.formbox{display:flex;align-items:center;justify-content:center;padding:20px}
.formbox form{background:#fff;padding:28px;border-radius:16px;width:100%;max-width:380px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;background:#e2e8f0;color:var(--ink)}.tabs .on{background:var(--pri);color:#fff}
.err{color:#dc2626;min-height:20px;font-size:13px}.hint{font-size:12px;color:var(--mut);line-height:1.6}
#hl,#hr{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}.cover #hl{transform:translate(20px,-84px)}.cover #hr{transform:translate(-20px,-84px)}
#pup{transition:transform .25s ease-out}.blink{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#wr{transform-origin:170px 190px;animation:wig 2.5s ease-in-out infinite}@keyframes wig{50%{transform:rotate(-14deg)}}
#mech{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header b{font-size:18px}header span{opacity:.8;font-size:13px}main{max-width:1000px;margin:20px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.c{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 1px 3px #0001}.c h3{margin:0;font-size:28px}.c p{margin:2px 0 0;color:var(--mut);font-size:13px}
.box{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:grid;grid-template-columns:110px 1fr 90px 100px;gap:8px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:hover{background:#f8fafc}.chip{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;text-align:center;background:#e2e8f0}
.High{background:#fee2e2;color:#b91c1c}.Medium{background:#fef3c7;color:#b45309}.Low{background:#dcfce7;color:#15803d}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar i{display:block;height:14px;background:var(--acc);border-radius:4px}.bar u{width:90px;text-decoration:none}
.tl{list-style:none;padding:0}.tl li{padding:6px 0 6px 26px;position:relative;color:var(--mut)}.tl li:before{content:"○";position:absolute;left:0}
.tl li.d{color:var(--ink);font-weight:600}.tl li.d:before{content:"✓";color:#16a34a}.tl li.n:before{content:"●";color:var(--acc)}
img.pic{max-width:100%;max-height:260px;border-radius:8px}@media(max-width:760px){.login,.two{grid-template-columns:1fr}.hero svg{width:200px}.row{grid-template-columns:90px 1fr 80px}.row :last-child{display:none}}

.staff-animation{font-size:70px;text-align:center;padding:15px;animation:move 2s infinite}
@keyframes move{50%{transform:translateY(-10px) rotate(5deg)}}
.work-card{text-align:center;background:#fff;border-radius:15px;padding:15px;margin:10px}

.av{font-size:58px;display:inline-block;line-height:1.1}
.hit{animation:hit .6s infinite}@keyframes hit{50%{transform:rotate(-16deg) translateY(-4px)}}
.zap{animation:zap 1s infinite}@keyframes zap{40%{transform:scale(1.15)}45%{filter:brightness(2.2)}50%{transform:scale(1)}}
.drip,.bounce{animation:bnc .9s infinite}@keyframes bnc{50%{transform:translateY(-10px)}}
.typ{animation:typ .25s infinite}@keyframes typ{50%{transform:translateX(3px)}}
.swp{animation:swp 1.2s ease-in-out infinite}@keyframes swp{50%{transform:rotate(18deg)}}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.35}}
.hop{display:inline-block;font-size:38px;animation:hop .45s infinite}@keyframes hop{50%{transform:translateY(-9px) rotate(-6deg)}}
.dots:after{content:'';animation:dt 1.4s steps(1) infinite}@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.lv{text-align:center;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.trk{position:relative;height:56px;margin:4px 0 10px;border-bottom:3px dashed #cbd5e1}
.trk .w{position:absolute;bottom:0;left:0;animation:walk 7s linear infinite}@keyframes walk{to{left:calc(100% - 90px)}}
.trk .pin{position:absolute;right:4px;bottom:2px;font-size:32px;animation:bnc 1s infinite}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.sc{background:#fff;border-radius:16px;padding:16px;text-align:center;box-shadow:0 1px 3px #0001}
.ur{display:grid;grid-template-columns:90px 1fr 1fr 80px;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:center}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ba figure{margin:0;text-align:center}.ba figcaption{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.ph{height:130px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.sug{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;margin:-4px 0 12px;font-size:14px}.sug button{padding:4px 12px;margin-left:6px}
.dup{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px;margin:0 0 12px}.dr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #fde68a}.dup>button{margin-top:10px}
.chat{max-height:280px;overflow-y:auto;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 40px 6px 0;width:fit-content;max-width:85%}.msg.me{margin:6px 0 6px auto;background:#dbeafe;border-color:#bfdbfe}.msg small{color:var(--mut);font-size:11px;display:block}
#cf{display:flex;gap:8px}#cf input{margin:0}
.rec{padding:8px 0;border-bottom:1px solid var(--line)}.pf{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:6px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.pf.h{font-weight:700;color:var(--mut);font-size:12px}
@media(max-width:760px){.ba{grid-template-columns:1fr}.pf{grid-template-columns:1.3fr repeat(3,1fr)}.pf>:nth-child(n+5){display:none}}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;z-index:9;box-shadow:0 4px 14px #0004}

/* Enhanced evidence dropzone */

.cf-value{display:flex;align-items:center;gap:10px;min-width:0}.cf-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:rgba(139,92,246,.14);border:1px solid rgba(168,85,247,.22);font-size:13px}.cf-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cf-arrow{width:9px;height:9px;border-right:2px solid #8da5c5;border-bottom:2px solid #8da5c5;transform:rotate(45deg) translateY(-2px);transition:.2s}.cf-select.is-open .cf-arrow{transform:rotate(225deg) translate(-1px,-1px);border-color:#d9b7ff}
.cf-menu{position:absolute;left:0;right:0;top:calc(100% + 7px);padding:7px;max-height:250px;overflow:auto;border-radius:16px;border:1px solid rgba(139,92,246,.38);background:linear-gradient(180deg,rgba(7,15,32,.99),rgba(3,9,21,.99));box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 35px rgba(124,58,237,.14);backdrop-filter:blur(18px);opacity:0;transform:translateY(-7px) scale(.98);pointer-events:none;transition:.18s ease}.cf-select.is-open .cf-menu{opacity:1;transform:none;pointer-events:auto}
.cf-option{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:#b9c9df;font-weight:600;text-align:left;cursor:pointer}.cf-option:hover{background:linear-gradient(90deg,rgba(124,58,237,.28),rgba(39,199,255,.10));color:#fff}.cf-option.selected{background:linear-gradient(90deg,rgba(124,58,237,.35),rgba(22,119,255,.18));color:#fff;box-shadow:inset 2px 0 #a855f7}.cf-option .tick{margin-left:auto;color:#54e1b0;opacity:0}.cf-option.selected .tick{opacity:1}
.cf-select.is-error .cf-trigger{border-color:#fb7185;box-shadow:0 0 0 3px rgba(251,113,133,.08)}
.observer-scene.typing .eye{animation:eyeFocus 1.25s ease-in-out infinite alternate}.observer-scene.typing .head{animation:robotFocus 2.2s ease-in-out infinite}.observer-scene.typing .penHand{animation:penWriteFast .62s ease-in-out infinite}.observer-scene.typing .note-line{animation-duration:1.45s}.observer-scene.done .eye{animation:eyeHappy 1.8s ease-in-out infinite}.observer-scene.done .penHand{animation:none;transform:rotate(-8deg)}
@keyframes eyeFocus{from{transform:scale(1)}to{transform:scale(1.075) translateY(-1px)}}
@keyframes robotFocus{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-2px)}}
@keyframes penWriteFast{50%{transform:rotate(-13deg) translate(-4px,5px)}}
@keyframes eyeHappy{0%,100%{transform:scale(1)}50%{transform:scale(1.04) translateY(-1px)}}

.fix-route{display:flex;align-items:center;gap:10px;margin:12px auto 18px;max-width:390px}.fix-route-line{height:2px;flex:1;background:linear-gradient(90deg,#34d399,#a855f7,#243555);position:relative;overflow:hidden}.fix-route-line:after{content:"";position:absolute;left:-20%;width:20%;height:100%;background:#fff;box-shadow:0 0 12px #fff;animation:routeScan 1.6s linear infinite}.fix-node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(168,85,247,.45);background:#09152d;color:#bda7ff;font-size:14px;box-shadow:0 0 18px rgba(139,92,246,.12)}.fix-node.active{color:#66e6b0;border-color:#34d399;box-shadow:0 0 22px rgba(52,211,153,.2)}
@keyframes routeScan{to{left:110%}}
.fix-bay{height:96px;margin:0 auto 14px;max-width:410px;border:1px solid rgba(39,199,255,.18);border-radius:18px;background:linear-gradient(180deg,rgba(12,28,54,.85),rgba(4,10,22,.9));position:relative;overflow:hidden}.fix-bay:before{content:"MAINTENANCE BAY 01";position:absolute;top:10px;left:14px;font-size:8px;letter-spacing:.2em;color:#6e8baa}.fix-bay-track{position:absolute;left:15px;right:15px;bottom:20px;height:2px;background:#253856}.fix-walker{position:absolute;left:18px;bottom:13px;font-size:28px;filter:drop-shadow(0 0 10px rgba(168,85,247,.5));animation:walkToBay 3.2s cubic-bezier(.2,.7,.2,1) forwards}.fix-wrench{position:absolute;right:17px;bottom:18px;font-size:24px;animation:wrenchReady 1s ease-in-out infinite}.fix-bay-status{position:absolute;right:12px;top:9px;font-size:8px;color:#62e3b0;letter-spacing:.08em}
@keyframes walkToBay{0%{left:18px;transform:translateY(0)}25%{transform:translateY(-7px) rotate(-5deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-6px) rotate(-4deg)}100%{left:calc(100% - 66px);transform:translateY(0) rotate(0)}}
@keyframes wrenchReady{50%{transform:rotate(-12deg) translateY(-3px)}}
.success-card.repair-mode{width:min(570px,calc(100% - 30px));padding:28px}.success-card.repair-mode .success-robot{width:145px}.success-sub{color:#8da8c9;font-size:12px;margin-top:-2px}.repair-state{font-size:12px;color:#6ee7b7;letter-spacing:.08em;font-weight:800;min-height:18px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');

/* ---------- CAMPUSFIX 3D VISUAL SYSTEM ---------- */
const S={token:localStorage.t,user:JSON.parse(localStorage.u||'null'),meta:null,loc:new URLSearchParams(location.search).get('loc')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(r.status==401&&S.token){logout();}if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
const logout=()=>{if(S.ws){S.ws.onclose=null;S.ws.close()};localStorage.clear();S.token=S.user=null;loginView()};

/* ---------- LOGIN + MECHANIC ---------- */
const MECH=`<svg id="mech" viewBox="0 0 360 420" aria-label="Fixy mechanic robot">
<defs>
 <linearGradient id="mMetal" x1="0" x2="1"><stop stop-color="#111a32"/><stop offset=".5" stop-color="#263b69"/><stop offset="1" stop-color="#0b1225"/></linearGradient>
 <linearGradient id="mPurple" x1="0" x2="1"><stop stop-color="#6d28d9"/><stop offset=".55" stop-color="#c026d3"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <filter id="mGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="180" cy="390" rx="118" ry="17" fill="#030712" stroke="#5b21b6" stroke-width="2"/>
<ellipse cx="180" cy="382" rx="98" ry="12" fill="none" stroke="#8b5cf6" stroke-width="5" opacity=".75" filter="url(#mGlow)"/>
<g id="mechBody">
 <rect x="118" y="258" width="124" height="105" rx="30" fill="url(#mMetal)" stroke="#5c75a8" stroke-width="3"/>
 <rect x="137" y="278" width="86" height="48" rx="10" fill="#050b1b" stroke="#22d3ee" stroke-width="2"/>
 <path d="M151 293h55M151 305h38M151 317h28" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
 <path d="M145 350h70" stroke="#a855f7" stroke-width="7" filter="url(#mGlow)"/>
 <path d="M142 252l16-31h44l16 31" fill="url(#mMetal)" stroke="#7288b5" stroke-width="3"/>
</g>
<g id="mechHead">
 <rect x="72" y="72" width="216" height="142" rx="30" fill="url(#mMetal)" stroke="#657aa8" stroke-width="4"/>
 <rect x="82" y="82" width="196" height="122" rx="23" fill="#080f27" stroke="url(#mPurple)" stroke-width="8"/>
 <circle class="mEye" cx="137" cy="140" r="20" fill="#f0abfc" filter="url(#mGlow)"/><circle class="mEye" cx="223" cy="140" r="20" fill="#f0abfc" filter="url(#mGlow)"/>
 <circle id="mPupilL" cx="137" cy="140" r="7" fill="#2e1065"/><circle id="mPupilR" cx="223" cy="140" r="7" fill="#2e1065"/>
 <path id="mBrowL" d="M114 111l42 0" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/><path id="mBrowR" d="M204 111l42 0" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
 <path id="mMouth" d="M151 174q29 19 58 0" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
 <circle cx="283" cy="126" r="8" fill="#22d3ee" filter="url(#mGlow)"/>
</g>
<g id="mechNeck"><path d="M154 218v38M206 218v38" stroke="#6f82aa" stroke-width="13"/><circle cx="154" cy="230" r="7" fill="#22d3ee"/><circle cx="206" cy="230" r="7" fill="#22d3ee"/></g>
<g id="wr" transform-origin="290 270"><path d="M269 282l25-86" stroke="#cbd5e1" stroke-width="15" stroke-linecap="round"/><path d="M293 196l-10-20 15-25 17 25-10 20" fill="#a855f7" stroke="#dbeafe" stroke-width="4"/></g>
<g id="mechArm"><path d="M244 285q50 18 61 68" fill="none" stroke="#1e3156" stroke-width="25" stroke-linecap="round"/><circle cx="307" cy="354" r="19" fill="#1d3155" stroke="#93a7d0" stroke-width="3"/></g>
</svg>`;

function look(inp){ // pupils follow the caret while typing
 const v=inp.value||'',pos=inp.selectionStart??v.length,r=Math.min(pos,26)/26;
 $('#pup').style.transform=`translate(${-6+r*12}px,${v||inp.type=='password'?5:2}px)`;
 $('#say').textContent=inp.type=='password'?'🙈 I am not looking!':v?'👀 '+v:'👀 Waiting for you…'}
function loginView(mode='login'){
 app.innerHTML=`<div class="login">
 <div class="hero">
   <div class="hero-kicker">🔧 CAMPUS OPERATIONS · LIVE</div>
   ${MECH}
   <div id="say">👀 Hi! I'm Fixy — your campus mechanic.</div>
   <h1>Campus<span style="color:#a855f7">Fix</span></h1>
   <p>Track · Report · Fix · Together</p>
   <div class="hero-stats"><span>24/7 <small>Support</small></span><span>Faster <small>Resolution</small></span><span>Better <small>Campus</small></span></div>
 </div>
 <div class="formbox"><form id="f">
   <div class="tabs"><button type="button" class="${mode=='login'?'on':''}" onclick="loginView('login')">Login</button><button type="button" class="${mode=='reg'?'on':''}" onclick="loginView('reg')">Register</button></div>
   <h2 style="margin:0 0 5px;font-size:27px">Welcome back</h2><p class="hint" style="margin-top:0">Login to continue to CampusFix.</p>
   ${mode=='reg'?'<label>Full name</label><input id="name" required placeholder="Your name"><label>Department</label><input id="dept" placeholder="CSE / IT / ECE">':''}
   <label>Email</label><input id="email" type="email" required autocomplete="username" placeholder="you@college.edu">
   <label>Password</label><div style="position:relative"><input id="pw" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
   <div class="err" id="err"></div><button style="width:100%;font-size:15px;padding:13px">${mode=='login'?'Login  →':'Create student account  →'}</button>
   <p class="hint" style="margin-top:20px">Demo: admin@campus.com / admin123<br>staff@campus.com / staff123<br>student@campus.com / student123</p>
 </form></div></div>`;
 const em=$('#email'),pw=$('#pw'),mech=$('#mech');
 const face=(state='watch')=>{
   const L=$('#mPupilL'),R=$('#mPupilR'),ml=$('#mMouth'),bl=$('#mBrowL'),br=$('#mBrowR');
   if(!L)return;
   if(state==='password'){L.style.transform=R.style.transform='translateY(5px)';bl.setAttribute('transform','rotate(18 135 111)');br.setAttribute('transform','rotate(-18 225 111)');ml.setAttribute('d','M151 178q29 -10 58 0')}
   else if(state==='typing'){bl.setAttribute('transform','rotate(-6 135 111)');br.setAttribute('transform','rotate(6 225 111)');ml.setAttribute('d','M158 175q22 12 44 0')}
   else{bl.removeAttribute('transform');br.removeAttribute('transform');ml.setAttribute('d','M151 174q29 19 58 0')}
 };
 const look=(inp)=>{const v=inp.value||'',r=Math.min(1,v.length/24),x=-6+r*12;$('#mPupilL').style.transform=`translate(${x}px,${inp.type==='password'?5:0}px)`;$('#mPupilR').style.transform=`translate(${x}px,${inp.type==='password'?5:0}px)`;$('#say').textContent=inp.type==='password'?'🙈 Fixy is looking away…':v?'👀 Reading what you enter…':'👀 Hi! I’m watching and ready to help.';face(inp.type==='password'?'password':v?'typing':'watch')};
 ['input','keyup','click','focus'].forEach(e=>em.addEventListener(e,()=>look(em)));
 pw.addEventListener('focus',()=>look(pw));pw.addEventListener('input',()=>look(pw));pw.addEventListener('blur',()=>face('watch'));
 $('#name')?.addEventListener('input',e=>look(e.target));
 $('#f').onsubmit=async e=>{e.preventDefault();try{
  const r=await api('/auth/'+(mode=='login'?'login':'register'),'POST',{email:em.value,password:pw.value,name:$('#name')?.value,department:$('#dept')?.value});
  S.token=r.token;S.user=r.user;localStorage.t=r.token;localStorage.u=JSON.stringify(r.user);start()
 }catch(x){$('#err').textContent=x.message;face('password')}}}

/* ---------- SHELL ---------- */
async function start(){
 if(!S.token)return loginView();
 S.meta=await api('/meta');
 app.innerHTML=`<div class="ambient-grid"></div><header><div class="brand"><span class="brand-mark">✦</span><div><b>Campus<span>Fix</span></b><small>COLLEGE OPERATIONS</small></div><span id="live" class="live-pill">⚪ CONNECTING</span></div><div class="userbar"><span>${esc(S.user.name)} · ${S.user.role}</span><button class="navbtn" onclick="dash()">Dashboard</button> <button class="navbtn" onclick="history()">History</button> <button class="navbtn" onclick="team()">Team</button> ${S.user.role=='student'?'<button class="primary-nav" onclick="newForm()">＋ Report issue</button>':''} <button class="navbtn logout-btn" onclick="logout()">Logout</button></div></header><main id="m"></main>`;

 connect();
 if(S.loc&&S.user.role=='student'){newForm(S.loc);S.loc=null}else dash()}
const main=h=>{$('#m').innerHTML=`<div class="page-content">${h}</div>`;requestAnimationFrame(()=>enhanceSelects())},chip=(t,c)=>`<span class="chip ${c||''}">${esc(t)}</span>`;
const card=(n,l)=>`<div class="c"><h3>${n}</h3><p>${l}</p></div>`;
const bars=(t,a)=>{const mx=Math.max(1,...a.map(x=>x[1]));return `<div class="box"><b>${t}</b>${a.map(([k,v])=>`<div class="bar"><u>${esc(k)}</u><i style="width:${v/mx*60+3}%"></i>${v}</div>`).join('')||'<p class="hint">No data yet</p>'}</div>`};

async function dash(){S.v=['dash'];
 const list=await api('/complaints'),done=x=>['Resolved','Closed'].includes(x.status);let h=`<section class="dashboard-hero"><div><span class="eyebrow">CAMPUSFIX / LIVE OPERATIONS</span><h1>Keep every corner of campus <span>working.</span></h1><p>Report problems, follow repairs and keep maintenance transparent from first alert to final fix.</p><div class="hero-actions">${S.user.role=='student'?'<button onclick="newForm()" class="primary-nav">＋ Report a problem</button>':''}<span class="status-line">● Real-time maintenance network</span></div></div><div class="hero-visual"><div class="core-orbit"><i></i><i></i><i></i><b>✦</b></div><div class="visual-grid"></div><div class="visual-label">REPAIR CORE <span>ACTIVE</span></div></div></section><h2 class="section-title">Welcome back, ${esc(S.user.name)}</h2>`;
 if(S.user.role=='admin'){const s=await api('/stats');
  h+=`<div class="cards">${card(s.total,'Total')}${card(s.pending,'Pending')}${card(s.resolved,'Resolved')}${card(s.high,'High priority open')}${card(s.avgDays+'d','Avg resolution')}</div>
  <div class="two">${bars('Complaints by category',s.byCategory)}${bars('Complaints by building',s.byBuilding)}</div>
  <div class="two">${bars('🔥 Hotspots (building – category)',s.hotspots.map(x=>[x.label,x.count]))}${bars('Complaints per month',s.trend)}</div>
  <div class="box"><b>🔄 Recurring problems (last 30 days)</b>${s.recurring.map(r=>`<div class="rec"><b>${esc(r.building)} – ${esc(r.category)}</b> ${chip(r.count+' complaints','High')}${r.growth!=null?` <small class="hint">${r.growth>0?'+':''}${r.growth}% vs previous 30 days</small>`:''}<br><small class="hint">${esc(r.message)}<br>➡ ${esc(r.recommendation)}</small></div>`).join('')||'<p class="hint">No recurring patterns detected yet.</p>'}</div>
  <div class="box"><b>⏱ Overdue (${s.overdue.length})</b>${s.overdue.map(o=>`<div class="rec" style="cursor:pointer" onclick="detail('${o.id}')">🔴 <b>${esc(o.title)}</b> <small class="hint">${o.id.slice(-8)} · ${esc(o.location)} · ${esc(o.staff||'unassigned')} · ${o.daysLate} day(s) late</small></div>`).join('')||'<p class="hint">Nothing overdue 🎉</p>'}</div>
  <div class="two"><div class="box"><b>Avg resolution days by category</b>${s.avgByCategory.map(([k,v])=>`<div class="bar"><u>${esc(k)}</u>${v}d</div>`).join('')||'<p class="hint">No resolved complaints yet</p>'}</div>
  <div class="box"><b>👨‍🔧 Staff performance</b><div class="pf h"><span>Name</span><span>Assigned</span><span>Resolved</span><span>Avg days</span><span>Rating</span><span>Overdue</span></div>${s.staffPerf.map(f=>`<div class="pf"><span>${esc(f.name)}</span><span>${f.assigned}</span><span>${f.resolved}</span><span>${f.avgDays??'–'}</span><span>${f.rating?f.rating+' ★':'–'}</span><span>${f.overdue}</span></div>`).join('')}</div></div>`}
 else h+=`<div class="cards">${card(list.length,'Active')}${card(list.filter(x=>x.priority=='High').length,'High priority')}${card('History','Resolved / Closed')}</div>`;
 h+=`<div class="box"><b>${S.user.role=='staff'?'Assigned to me':S.user.role=='admin'?'Active complaints':'My active complaints'}</b>${list.map(c=>`<div class="row" onclick="detail('${c.id}')"><span>${c.id.slice(-8)}</span><span>${esc(c.title)}<br><small class="hint">${esc(c.location)}${c.affectedCount>1?' · 👥 '+c.affectedCount+' affected':''}${c.userId!=S.user.id&&S.user.role=='student'?' · you are affected too':''}</small></span>${chip(c.priority,c.priority)}${chip(c.status)}</div>`).join('')||'<p class="hint">No active complaints.</p>'}</div>`;
 if(S.user.role=='admin')h+=`<details class="box"><summary><b>QR links per room</b> (turn each link into a QR code and stick it in the room)</summary>${S.meta.locations.map(l=>`<div class="hint">${esc(l.building)} · Room ${l.room}: ${location.origin}/?loc=${l.id}</div>`).join('')}</details>`;
 main(h)}

/* ---------- HISTORY ---------- */
async function history(){S.v=['history'];
 try{
  const list=await api('/history'),isAdmin=S.user.role=='admin';
  main(`<button class="alt" onclick="dash()">← Dashboard</button><h2 style="margin-top:12px">History</h2><div class="cards">${card(list.length,'Resolved / Closed')}${card(list.filter(x=>x.status=='Resolved').length,'Resolved')}${card(list.filter(x=>x.status=='Closed').length,'Closed')}</div><div class="box"><b>Past maintenance complaints</b>${list.map(c=>`<div class="row"><span onclick="detail('${c.id}')" style="cursor:pointer">${c.id.slice(-8)}</span><span onclick="detail('${c.id}')" style="cursor:pointer">${esc(c.title)}<br><small class="hint">${esc(c.location)} · ${new Date(c.createdAt).toLocaleDateString()}</small></span>${chip(c.status)}${isAdmin?`<button class="danger" onclick="delHistory('${c.id}')">Delete</button>`:''}</div>`).join('')||'<p class="hint">No resolved complaints in history.</p>'}</div>`);
 }catch(e){toast(e.message)}
}
async function delHistory(id){if(!confirm('Permanently delete this complaint from history? This cannot be undone.'))return;try{await api('/history/'+id,'DELETE');toast('History item deleted');history()}catch(e){toast(e.message)}}

/* ---------- NEW COMPLAINT ---------- */
function closeSelectMenus(except){document.querySelectorAll('.cf-select.is-open').forEach(w=>{if(w!==except)w.classList.remove('is-open')})}
function enhanceSelect(id,icon='◆'){
 const sel=document.getElementById(id);if(!sel||sel.dataset.cfEnhanced==='1')return;
 const wrap=document.createElement('div');wrap.className='cf-select';wrap.dataset.for=id;
 const trigger=document.createElement('button');trigger.type='button';trigger.className='cf-trigger';
 const value=document.createElement('span');value.className='cf-value';const ico=document.createElement('span');ico.className='cf-icon';ico.textContent=icon;const lab=document.createElement('span');lab.className='cf-label';const arrow=document.createElement('span');arrow.className='cf-arrow';value.append(ico,lab);trigger.append(value,arrow);
 const menu=document.createElement('div');menu.className='cf-menu';
 function sync(){const opt=sel.options[sel.selectedIndex];lab.textContent=opt?.text||'Select';menu.querySelectorAll('.cf-option').forEach((b,i)=>b.classList.toggle('selected',i===sel.selectedIndex));}
 function build(){menu.innerHTML='';[...sel.options].forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='cf-option';b.innerHTML=`<span>${esc(opt.text)}</span><span class="tick">✓</span>`;b.onclick=()=>{sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();wrap.classList.remove('is-open')};menu.appendChild(b)});sync()}
 trigger.onclick=()=>{const open=!wrap.classList.contains('is-open');closeSelectMenus(wrap);wrap.classList.toggle('is-open',open)};
 wrap.append(trigger,menu);sel.classList.add('cf-native');sel.dataset.cfEnhanced='1';sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);build();sel.addEventListener('change',sync);return {wrap,build,sync};
}
function enhanceSelects(){
 const icons={cat:'⚡',bld:'⌂',loc:'▣',pri:'◈',st:'⚙',pr:'◆',rt:'★',ur:'◉'};

 el.innerHTML=st.map(s=>{const a=AV(s.department);return `<div class="sc"><div class="av ${s.active?a[1]:''}">${a[0]}</div><br><b>${esc(s.name)}</b><br><small class="hint">${a[2]} · ${esc(s.department||'General')}</small><br>
  <span class="chip">${s.online?'🟢 Online':'⚪ Offline'}</span><p class="hint">${s.active?'🛠 '+s.active+' active':'💤 Free'} · ${s.done} done</p></div>`}).join('')||'<p class="hint">No staff yet.</p>'}
async function userList(){const us=await api('/users');
 $('#ul').innerHTML=`<b>All accounts (${us.length})</b>`+us.map(u=>`<div class="ur">${chip(u.role)}<span>${esc(u.name)}</span><span class="hint">${esc(u.email)} ${esc(u.department||'')}</span>${u.role=='admin'?'<span></span>':`<button class="alt" onclick="delUser(${u.id})">Remove</button>`}</div>`).join('')}
async function team(){S.v=['team'];const adm=S.user.role=='admin',specialties=['Electrical','IT Support','Plumbing','Furniture','Cleaning','Mechanical','Driver / Transport','Canteen','Bathroom','Air Cooler / AC Technician','Security','Grounds / Garden','Carpentry'].map(x=>`<option>${esc(x)}</option>`).join('');
 let h=`<h2>Maintenance Team</h2><p class="hint">Campus support is broader than repairs — Fixy can route transport, food, bathroom, cooling and security requests too.</p><div class="staff-specialties">${['⚡ Electrical','💻 IT Support','🚰 Plumbing','🔧 Mechanical','🚗 Driver / Transport','🍽️ Canteen','🚿 Bathroom','❄️ Air Cooler / AC Technician','🛡️ Security','🌿 Grounds / Garden','🪑 Furniture','🧹 Cleaning'].map(x=>`<span class="specialty-chip">${x}</span>`).join('')}</div><div class="sg" id="tc"></div>`;
 if(adm)h+=`<div class="box" style="margin-top:16px"><h3>➕ Add student / staff</h3><form id="uf"><div class="two"><div><label>Role</label><select id="ur"><option value="student">Student</option><option value="staff">Staff</option></select>
  <label>Full name</label><input id="un" required><label>Email</label><input id="ue" type="email" required></div>
  <div><label>Temporary password (6+ chars)</label><input id="up" required minlength="6"><label>Department / specialty</label><input id="ud" list="dl" placeholder="Mechanical, Driver, Canteen…"><datalist id="dl">${specialties}</datalist>
  <div class="err" id="err"></div><button>Create account</button></div></div></form></div><div class="box" id="ul"></div>`;
 main(h);teamCards();
 if(adm){userList();$('#uf').onsubmit=async e=>{e.preventDefault();try{await api('/users','POST',{role:$('#ur').value,name:$('#un').value,email:$('#ue').value,password:$('#up').value,department:$('#ud').value});toast('Account created');team()}catch(x){$('#err').textContent=x.message}}}}
async function delUser(id){if(!confirm('Remove this account?'))return;try{await api('/users/'+id,'DELETE');teamCards();userList()}catch(e){toast(e.message)}}

/* ---------- REAL-TIME (WebSocket) ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}
function connect(){if(!S.token||(S.ws&&S.ws.readyState<2))return;
 const w=S.ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws?token='+S.token);
 w.onopen=()=>{const l=$('#live');if(l)l.textContent='🟢 Live'};
 w.onclose=()=>{const l=$('#live');if(l)l.textContent='🔴 Reconnecting…';if(S.token)setTimeout(connect,2000)};
 w.onmessage=e=>{const m=JSON.parse(e.data),v=S.v||[];
  if(m.type=='update'){toast(`${m.id.slice(-8)} → ${m.status}`);
   if(v[0]=='dash')dash();else if(v[0]=='history')history();else if(v[0]=='detail'&&v[1]==m.id)detail(m.id);else if(v[0]=='team')teamCards()}
  if(m.type=='historyDeleted'){if(v[0]=='history')history();else if(v[0]=='detail'&&v[1]==m.id)history();toast(`${m.id.slice(-8)} deleted from history`)}
  if(m.type=='chat'){if(v[0]=='detail'&&v[1]==m.id)api('/complaints/'+m.id).then(c=>renderMsgs(c.messages)).catch(()=>{});
   else if(m.userId!=S.user.id)toast(`💬 ${m.name}: ${m.text.slice(0,40)} (${m.id.slice(-8)})`)}
  if(m.type=='affected'){if(v[0]=='dash')dash();else if(v[0]=='detail'&&v[1]==m.id)detail(m.id);toast(`👥 ${m.id.slice(-8)} – ${m.count} affected`)}
  if(m.type=='presence'&&v[0]=='team')teamCards()}}
start().catch(()=>loginView());
</script></body></html>
